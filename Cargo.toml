[workspace]
resolver = "3"
members = ["export","cli","parser", "gui"]
default-members = ["parser"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Parse, filter and export (full) Safaricom MPesa statements"
readme = "README.md"
repository = "https://github.com/aynugek/m-parser"
license = "MIT"
keywords = ["mpesa", "safaricom", "statement", "mparser"]
categories = ["command-line-utilities", "parsing", "finance"]

[workspace.dependencies]
argh = "0.1.19"
thiserror = "2.0.20"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
