[package]
name = "m-parser"
version = "0.1.0"
edition = "2024"
description = "Parse, filter and export (full) Safaricom MPesa statements"
readme = "README.md"
repository = "https://github.com/aynugek/m-parser"
license = "MIT"
keywords = ["mpesa", "safaricom", "statement", "mparser"]
categories = ["command-line-utilities", "parsing", "finance"]

[dependencies]
argh = "0.1.19"
chrono = { version = "0.4.45", features = ["serde"] }
pdf-inspector = { git = "https://github.com/aynugek/pdf-inspector", branch = "text_positions_and_rects", version = "1.15.0" }
rust_decimal = "1.42.1"
rust_xlsxwriter = { version = "0.99.0", features = ["chrono", "rust_decimal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
